<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <filter id="vapor" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".005 .009" numOctaves="4" seed="23" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .47 0 0 0 0 .53 0 0 0 0 .55 1.7 0 0 0 -.67"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="fade">
      <stop offset="0" stop-color="white"/>
      <stop offset=".4" stop-color="white" stop-opacity=".7"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="cloud-shape"><rect width="1280" height="800" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="800" filter="url(#vapor)" mask="url(#cloud-shape)"/>
</svg>
